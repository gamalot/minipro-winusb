[package]
name = "minipro_winusb"
version = "0.1.2"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies.windows-sys]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Gdi",
  "Win32_Devices_Usb",
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_System_IO",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_Pipes",
  "Win32_Storage_FileSystem",
  "Win32_Security",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
]
