[package]
name = "minipro-ui"
version = "0.1.3"
edition = "2021"
build = "build.rs"

[[bin]]
name = "minipro-ui"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
eframe = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rfd = "0.18.0"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[features]
# self-test script steps that write the chip or need an empty socket (program, erase, selfcheck);
# off in published builds
selftest = []
