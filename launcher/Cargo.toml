[package]
name = "minipro-launcher"
version = "0.1.1"
edition = "2021"
build = "build.rs"

[dependencies.windows-sys]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_System_Memory",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
]

[[bin]]
name = "minipro-launch"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"
